name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install test prerequisites
        run: sudo apt-get update && sudo apt-get install -y sqlite3
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      # Build assets before Go: they are embedded in the executable.
      - run: npm run build
      # Scope Go tools so they never traverse dependency sources in node_modules.
      - run: go vet ./cmd/... ./internal/...
      - run: npm run test:go
      - run: npm run test:http
      - run: npm run test:backchannel
      - run: npx playwright install --with-deps chromium
      - name: Browser contracts against the Go binary
        run: npm run test:navegador
      # Historical image only. No legacy backend source or build remains here.
      - name: Compatibility and rollback against pinned Node 0.5.0
        run: npm run test:compatibilidad
      - run: docker build -t qrforge-go:ci .
      - name: Runtime contains no Node tooling
        run: docker run --rm --entrypoint sh qrforge-go:ci -ec 'if command -v node || command -v npm; then exit 1; fi; test -x /usr/local/bin/qrforge'
      - name: Browser contracts against the final image
        env:
          QRFORGE_TEST_LAUNCH: bash scripts/lanzar-imagen.sh
          QRFORGE_TEST_IMAGE: qrforge-go:ci
        run: npm run test:navegador
