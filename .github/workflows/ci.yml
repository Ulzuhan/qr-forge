name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Antes del build: son funciones puras y tardan menos de un segundo.
      # Cubren safeNext(), que estuvo abierta en cuatro servicios a la vez.
      - run: npm run test:unit

      - run: npm run build
      - run: npm run test:http

      # Con un proveedor de mentira que FIRMA de verdad: el aviso de cierre de
      # sesión no se puede probar de otra forma.
      - run: npm run test:backchannel

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit

      # `web/` es el frontend de Vite del backend Go, con su propio shim de
      # Link: está fuera del tsconfig raíz y se comprueba aparte para que no se
      # quede sin verificar.
      - run: npx tsc -p web/tsconfig.json --noEmit

      # ─── El backend Go ────────────────────────────────────────────────
      # El port se sostiene sólo si las MISMAS suites pasan contra las dos
      # implementaciones, sin tocar una aserción.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.27.1'
          cache: false

      # Antes de vet y de compilar: los assets se embeben con go:embed, y el
      # repositorio sólo guarda un `dist` con el .gitkeep que hace que el
      # paquete compile en un clon limpio.
      - run: npm run build:web

      # `./...` entraría en node_modules, que trae un paquete Go dentro.
      - run: go vet ./cmd/... ./internal/...
      - run: go test -race -count=1 ./cmd/... ./internal/...
      - run: go build -o ./qrforge ./cmd/qrforge

      - name: Las suites HTTP, contra el binario Go
        env:
          QRFORGE_TEST_LAUNCH: ./qrforge
          QRFORGE_TEST_BUILD_STAMP: ./qrforge
          QRFORGE_INSECURE_COOKIES: "1"
        run: npm run test:http

      - name: El aviso de cierre de sesión, contra el binario Go
        env:
          QRFORGE_TEST_LAUNCH: ./qrforge
          QRFORGE_INSECURE_COOKIES: "1"
        run: npm run test:backchannel

      # El navegador de verdad. Se instala sólo Chromium y sólo aquí: no entra
      # en ninguna imagen.
      - run: npx playwright install --with-deps chromium

      - name: El recorrido en navegador, contra el binario Go
        env:
          QRFORGE_TEST_LAUNCH: ./qrforge
        run: npm run test:navegador

      # Node 0.5.0 exacto → Go → Node sobre la misma base. Es lo que decide si
      # se puede cambiar de implementación y VOLVER.
      - name: Compatibilidad y vuelta atrás
        env:
          QRFORGE_COMPAT_GO: ./qrforge
        run: npm run test:compatibilidad

      # ─── Y contra la IMAGEN, no sólo contra el binario ────────────────
      # El binario se compila con los assets buenos del anfitrión, así que no
      # puede ver lo que se rompe DENTRO de la imagen —un PostCSS que no entra
      # en su build, un fichero que no se copia—. Correrlo sólo contra el
      # binario deja esa parte sin acreditar en CI.
      - run: docker build -t qrforge-go:ci .

      - name: El recorrido en navegador, contra la imagen
        env:
          QRFORGE_TEST_LAUNCH: bash scripts/lanzar-imagen.sh
          QRFORGE_TEST_IMAGE: qrforge-go:ci
        run: npm run test:navegador
