name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Antes del build: son funciones puras y tardan menos de un segundo.
      # Cubren safeNext(), que estuvo abierta en cuatro servicios a la vez.
      - run: npm test

      - run: npm run build

      # After the build on purpose: Next generates the route types the checker
      # relies on (.next/types) during the build.
      - run: npx tsc --noEmit
