services:
  qr-forge:
    # La candidata en Go. Al promover, esto vuelve a ser `build: .` porque el
    # Dockerfile pasará a ser éste.
    build:
      context: .
      dockerfile: Dockerfile.go-candidate
    restart: unless-stopped
    init: true
    # Declarado, no heredado: el binario reparte su parada dentro de este plazo
    # (6 s de cierre HTTP + 2 s de drenaje de escaneos, con margen). Subirlo aquí
    # antes que allí; bajarlo sin tocar el binario dejaría el drenaje a medias.
    stop_grace_period: 10s
    ports:
      - "127.0.0.1:3459:3459"
    env_file:
      - path: .env
        required: false
    volumes:
      - qrforge-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=0700,uid=10001,gid=10001
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1.5

volumes:
  qrforge-data:
